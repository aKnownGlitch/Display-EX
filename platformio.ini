[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1131301
monitor_port = /dev/tty.usbmodem1131301
upload_flags = -x delay=100

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    mcufriend/MCUFRIEND_kbv @ ^5.9.11

build_flags =
    -DARDUINO_BOARD=ARDUINO_AVR_MEGA2560
    -std=c++11

upload_speed = 115200
